<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libyan Islamic Bank</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="logo">
                <img src="images/logo.png" alt="Libyan Islamic Bank">
            </div>

            <a href="index.html" class="lang-toggle">AR</a>
        </div>

        <!-- Mobile Navigation -->
        <nav class="mobile-nav" id="mobileNav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Slider -->
    <section class="banner">
        <div class="banner-track" id="bannerTrack">
            <div class="banner-slide active">
                <img src="images/banner1.jpg" alt="Aspirations supported by values">
            </div>
            <div class="banner-slide">
                <img src="images/banner2.jpg" alt="Libyan Islamic Bank">
            </div>
            <div class="banner-slide">
                <img src="images/banner3.jpg" alt="LiBank Mobile App">
            </div>
            <div class="banner-slide">
                <img src="images/banner4.jpg" alt="Digital LIB">
            </div>
        </div>

        <button class="banner-btn banner-prev" id="prevBtn">&#10094;</button>
        <button class="banner-btn banner-next" id="nextBtn">&#10095;</button>

        <div class="banner-dots" id="bannerDots">
            <span class="dot active" data-index="0"></span>
            <span class="dot" data-index="1"></span>
            <span class="dot" data-index="2"></span>
            <span class="dot" data-index="3"></span>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
