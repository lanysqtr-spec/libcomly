<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libyan Islamic Bank</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="logo">
                <img src="images/logo.png" alt="Libyan Islamic Bank">
            </div>

            <a href="index.html" class="lang-toggle">AR</a>
        </div>

        <!-- Mobile Navigation -->
        <nav class="mobile-nav" id="mobileNav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Slider -->
    <section class="banner">
        <div class="banner-track" id="bannerTrack">
            <div class="banner-slide active">
                <img src="images/banner1.jpg" alt="Aspirations supported by values">
            </div>
            <div class="banner-slide">
                <img src="images/banner2.jpg" alt="Libyan Islamic Bank">
            </div>
            <div class="banner-slide">
                <img src="images/banner3.jpg" alt="LiBank Mobile App">
            </div>
        </div>

        <button class="banner-btn banner-prev" id="prevBtn">&#10094;</button>
        <button class="banner-btn banner-next" id="nextBtn">&#10095;</button>

        <div class="banner-dots" id="bannerDots">
            <span class="dot active" data-index="0"></span>
            <span class="dot" data-index="1"></span>
            <span class="dot" data-index="2"></span>
        </div>
    </section>

    <!-- Watches Section -->
    <section class="watches">
        <div class="watches-grid" id="watchesGrid"></div>
    </section>

    <template id="watchCardTemplate">
        <div class="watch-card">
            <img class="watch-img" src="" alt="">
            <div class="apple-warranty">
                <img src="images/apple-logo.jpg" alt="Apple">
                <p>Apple Warranty for 12 Months</p>
            </div>
            <div class="watch-features">
                <div class="feature-item"><img src="images/feature-apps.jpg" alt="All Apps"><p>All Apps</p></div>
                <div class="feature-item"><img src="images/feature-os.jpg" alt="Apple & Android"><p>Apple & Android</p></div>
                <div class="feature-item"><img src="images/feature-nfc.jpg" alt="Contactless Payment"><p>Contactless (NFC)</p></div>
                <div class="feature-item"><img src="images/feature-lang.jpg" alt="All Languages"><p>All Languages</p></div>
                <div class="feature-item"><img src="images/feature-sim.jpg" alt="SIM Card Support"><p>SIM Card Support</p></div>
                <div class="feature-item"><img src="images/feature-wifi.jpg" alt="Wi-Fi"><p>Wi-Fi Support</p></div>
                <div class="feature-item"><img src="images/feature-battery.jpg" alt="14 Days Battery"><p>14 Days Battery</p></div>
            </div>
            <div class="watch-info">
                <a href="#" class="watch-btn">Choose Your Watch</a>
            </div>
        </div>
    </template>

    <script>
    const watches = [
        {img: "images/watch1.jpg", name: "Silver"},
        {img: "images/watch2.jpg", name: "Black"},
        {img: "images/watch3.jpg", name: "Dark Blue"},
        {img: "images/watch4.jpg", name: "Yellow"},
        {img: "images/watch5.jpg", name: "Beige"},
        {img: "images/watch6.jpg", name: "Coral"},
        {img: "images/watch7.jpg", name: "Gold"},
        {img: "images/watch8.jpg", name: "Light Blue"},
        {img: "images/watch9.jpg", name: "Brown"},
        {img: "images/watch10.jpg", name: "Light Beige"},
        {img: "images/watch11.jpg", name: "Gray"},
        {img: "images/watch12.jpg", name: "Green"},
        {img: "images/watch13.jpg", name: "Orange"},
        {img: "images/watch14.jpg", name: "Navy"},
        {img: "images/watch15.jpg", name: "Olive"},
        {img: "images/watch16.jpg", name: "Red"},
        {img: "images/watch17.jpg", name: "White"},
        {img: "images/watch18.jpg", name: "Dark Navy"},
        {img: "images/watch19.jpg", name: "Jet Black"},
    ];
    const grid = document.getElementById('watchesGrid');
    const tpl = document.getElementById('watchCardTemplate');
    watches.forEach(w => {
        const card = tpl.content.cloneNode(true);
        card.querySelector('.watch-img').src = w.img;
        card.querySelector('.watch-img').alt = w.name;
        grid.appendChild(card);
    });
    </script>

    <script src="js/main.js"></script>
</body>
</html>
